name: Test

# Runs on every push and PR, unlike publish.yml which only runs at release
# time (a tag push). A broken commit should fail here long before anyone
# tags a release.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: npm ci

      - run: npm test
